# On every release tag, sync the package to R2 so cdn.boxofrules.com serves /v<tag>/ (immutable), /latest/
# and products/ at the root. One rclone sync per target: seconds, not minutes.
# Secrets: R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY (an R2 API token, Object Read and Write on bor-assets).
name: Publish to cdn.boxofrules.com

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq rclone >/dev/null
      - run: tools/publish-cdn.sh "${GITHUB_REF_NAME}"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
