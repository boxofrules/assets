# Dependabot, the Box Of Rules standard: monthly, one grouped PR per ecosystem, at most two
# open at a time. Every PR runs CI and Actions minutes are metered, so nothing weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
